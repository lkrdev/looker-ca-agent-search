[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ca-agent-sync"
version = "0.1.0"
description = "Synchronize Looker Conversational Analytics (CA) agent metadata to BigQuery with Autonomous Embedding Generation and semantic vector search routing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "google-cloud-bigquery>=3.20.0",
    "google-auth>=2.29.0",
    "looker-sdk>=26.0.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
]

[project.scripts]
ca-agent-sync = "ca_agent_sync.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ca_agent_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
